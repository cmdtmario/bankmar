# Teste de telas (Playwright) com Supabase simulado: abre todas as telas em celular e desktop,
# falha com erro de console, mensagem de erro ou rolagem horizontal. Prints ficam como artefato.
name: Telas
on: [push, pull_request]
jobs:
  telas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: prints-das-telas, path: tests/e2e/prints/, retention-days: 14 }

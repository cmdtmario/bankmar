# Testes e build a cada push (os testes com a planilha real são pulados: ela não está no repositório).
name: Testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
        env: { VITE_SUPABASE_URL: https://exemplo.supabase.co, VITE_SUPABASE_ANON_KEY: exemplo }

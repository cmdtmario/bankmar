# Publica as funções (avisos e investimentos) no Supabase a cada push na main.
# As migrations do banco são aplicadas pela integração GitHub do próprio Supabase.
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
name: Supabase (função de avisos)
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - if: env.REF == ''
        run: echo "::notice::Segredos do Supabase ainda nao configurados - nada a publicar."
      - if: env.REF != ''
        uses: actions/checkout@v4
      - if: env.REF != ''
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - if: env.REF != ''
        run: |
          supabase functions deploy avisos-vencimento --no-verify-jwt --project-ref "$REF"
          supabase functions deploy investimentos-diario --no-verify-jwt --project-ref "$REF"

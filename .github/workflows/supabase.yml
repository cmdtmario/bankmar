# Publica o banco (migrations) e a função de avisos no Supabase a cada push na main.
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
name: Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - if: env.REF == ''
        run: echo "::notice::Segredos do Supabase ainda nao configurados - nada a publicar."
      - if: env.REF != ''
        uses: actions/checkout@v4
      - if: env.REF != ''
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - if: env.REF != ''
        run: supabase link --project-ref "$REF"
      - if: env.REF != ''
        run: supabase db push
      - if: env.REF != ''
        run: supabase functions deploy avisos-vencimento --no-verify-jwt

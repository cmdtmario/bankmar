project_id = "bankmar"

# Integração GitHub do Supabase ativa (working directory ".", branch main).
# Configuração do Supabase CLI (opcional). O essencial: cadastro público desligado (RF-02)
# e verificação em duas etapas por app autenticador (RF-01).
[auth]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.avisos-vencimento]
verify_jwt = false  # protegida pelo CRON_SECRET

[functions.investimentos-diario]
verify_jwt = false  # aceita CRON_SECRET ou o token do usuário (verificado no código)

[functions.beneficios-mensal]
verify_jwt = false  # aceita CRON_SECRET ou o token do usuário (verificado no código)

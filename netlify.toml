# A hospedagem passou para o Cloudflare (wrangler.jsonc). O Netlify não publica mais nada:
# o "ignore" cancela todo build, então nenhuma publicação gasta crédito.
[build]
  command = "npm ci && npm run build"
  publish = "dist"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

# SPA: todas as rotas abrem o app (inclusive /c/<token> dos links de consulta)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
